[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "true-hq-audio"
version = "1.0.0"
description = "Bit-perfect reference audio player and rendering engine for Windows"
readme = "README.md"
requires-python = "==3.15.*"
license = { file = "LICENSE" }
authors = [{ name = "True HQ Audio Labs" }]
keywords = ["audio", "bit-perfect", "wasapi", "asio", "dsd", "dop", "flac"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PySide6==6.12.0",
    "numpy==2.5.4",
    "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
truehqaudio = "src.app:run"

[tool.setuptools]
packages = ["src", "src.core", "src.core.decoders", "src.ui", "src.ui.widgets"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py315"
