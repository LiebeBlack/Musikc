name: documentation

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "scripts/validate_docs.py"
      - "scripts/prepare_docs.py"
      - "tests/test_docs_site.py"
      - "requirements-dev.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Set up Python for application tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install application test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run application tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Validate required files and local links
        run: python scripts/validate_docs.py

      - name: Resolve repository and Pages URLs
        env:
          REPOSITORY: ${{ github.repository }}
        run: python scripts/prepare_docs.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
