name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15.2"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: pwsh

jobs:
  # ------------------------------------------------------------------ quality
  test:
    name: Tests · Python 3.15.2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.15.2
        id: setup-python
        uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          check-latest: false
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python 3.15.2 (fallback)
        if: steps.setup-python.outcome == 'failure'
        run: |
          $url = "https://www.python.org/ftp/python/3.15.2/python-3.15.2-amd64.exe"
          $installer = Join-Path $env:RUNNER_TEMP "python-3.15.2-amd64.exe"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0 Include_launcher=1" -Wait
          $pythonRoot = "C:\Program Files\Python315"
          if (-not (Test-Path $pythonRoot)) { throw "Python 3.15 installation failed" }
          Add-Content -Path $env:GITHUB_PATH -Value $pythonRoot
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $pythonRoot "Scripts")

      - name: Verify interpreter
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 15, 2), sys.version; print('Python 3.15.2 confirmed')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Byte-compile every module
        run: python -m compileall -q src main.py setup_env.py scripts

      - name: Unit and engine tests
        run: python -m pytest -q tests

      - name: Audio environment diagnostics
        continue-on-error: true
        run: python main.py --diagnostics

  # -------------------------------------------------------------------- build
  package:
    name: Freeze · Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.15.2
        id: setup-python
        uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
          check-latest: false
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python 3.15.2 (fallback)
        if: steps.setup-python.outcome == 'failure'
        run: |
          $url = "https://www.python.org/ftp/python/3.15.2/python-3.15.2-amd64.exe"
          $installer = Join-Path $env:RUNNER_TEMP "python-3.15.2-amd64.exe"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0 Include_launcher=1" -Wait
          $pythonRoot = "C:\Program Files\Python315"
          if (-not (Test-Path $pythonRoot)) { throw "Python 3.15 installation failed" }
          Add-Content -Path $env:GITHUB_PATH -Value $pythonRoot
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $pythonRoot "Scripts")

      - name: Verify interpreter
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 15, 2), sys.version; print('Python 3.15.2 confirmed')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Fetch native audio binaries (libsndfile, ffmpeg)
        run: |
          python setup_env.py --install-native
          if ($LASTEXITCODE -ne 0) { throw "setup_env --install-native failed with $LASTEXITCODE" }
          # Fail loudly if any required native binary is missing: silently
          # degrading here would ship an installer without ffmpeg.
          foreach ($name in "libsndfile-1.dll", "ffmpeg.exe", "ffprobe.exe", "manifest.json") {
            $path = Join-Path "resources\native" $name
            if (-not (Test-Path $path)) { throw "missing native binary: $path" }
          }
          Write-Host "native binaries verified: libsndfile-1.dll, ffmpeg.exe, ffprobe.exe"

      - name: Render icon and export QSS
        run: |
          python scripts/make_icon.py
          python scripts/export_stylesheet.py

      - name: Freeze the application
        run: python -m PyInstaller truehqaudio.spec --noconfirm --clean --distpath dist --workpath build

      - name: Smoke-test the frozen executable
        run: |
          $exe = "dist\TrueHQAudio\TrueHQAudio.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--diagnostics" -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "frozen diagnostics failed with $($proc.ExitCode)" }
          # The packaged app must carry the native decoders, not merely run.
          foreach ($name in "libsndfile-1.dll", "ffmpeg.exe", "ffprobe.exe") {
            $path = Join-Path "dist\TrueHQAudio\_internal\resources\native" $name
            if (-not (Test-Path $path)) { throw "frozen app is missing $name" }
          }

      - name: Resolve app version
        id: version
        run: |
          $match = Select-String -Path src\config.py -Pattern '^\s*APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "APP_VERSION not found in src\config.py" }
          $version = $match.Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "unexpected APP_VERSION format: $version" }
          Write-Host "APP_VERSION=$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build portable archive
        run: |
          $target = Join-Path (Resolve-Path "dist") "TrueHQAudio-${{ steps.version.outputs.version }}-portable-x64.zip"
          if (Test-Path $target) { Remove-Item $target }
          # ZipFile streams and includes hidden files; Compress-Archive's '*'
          # glob silently drops hidden entries and caps individual entries.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path (Resolve-Path "dist") "TrueHQAudio"),
            $target,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)
          Write-Host "created $target"

      - name: Install Inno Setup
        # Pinned: the .iss relies on Inno Setup 6.x directives and its default
        # install path; verify-ISCC below would fail loudly on any drift.
        run: choco upgrade innosetup --version=6.7.1 --allow-downgrade --yes --no-progress

      - name: Compile the installer
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC not found after installing Inno Setup 6.7.1" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "installer\truehqaudio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
          Get-ChildItem installer\Output\*.exe | ForEach-Object { Write-Host "installer: $($_.FullName)" }

      - name: Checksums
        run: |
          $files = @()
          $files += Get-ChildItem dist\*.zip
          $files += Get-ChildItem installer\Output\*.exe
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrueHQAudio-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            installer/Output/*.exe

  # ------------------------------------------------------------------ release
  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # contents: write is scoped to this job only; test/package build and upload
    # artifacts with read access, including on pull requests.
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: TrueHQAudio-windows-x64
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: True HQ Audio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
            release-assets/**/SHA256SUMS.txt
            release-assets/**/*.exe
